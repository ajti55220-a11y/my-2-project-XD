<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TERRAFORGE: WORLD &amp; CIV SIMULATOR</title>
<style>
  :root {
    --glass: rgba(10, 16, 28, 0.82);
    --glass-hi: rgba(16, 26, 44, 0.94);
    --border: rgba(125, 211, 252, 0.24);
    --border-active: rgba(52, 211, 153, 0.95);
    --accent: #34d399;
    --accent-2: #38bdf8;
    --warn: #fbbf24;
    --danger: #f43f5e;
    --text: #f8fafc;
    --muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050a14;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  #world-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    cursor: none;
    touch-action: none;
    z-index: 1;
  }

  /* =========================================================================
     ВЕРХНИЙ HUD И БЕГУЩАЯ НОВОСТНАЯ СТРОКА (BREAKING NEWS)
     ========================================================================= */
  .top-stack {
    position: fixed;
    top: 8px;
    left: 10px;
    right: 10px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }

  .top-hud {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
  }

  .hud-pill {
    pointer-events: auto;
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  .plumbob-icon {
    width: 14px;
    height: 20px;
    background: linear-gradient(135deg, #6ee7b7 0%, #10b981 55%, #047857 100%);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.75);
    flex-shrink: 0;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .stat-item strong {
    color: var(--text);
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .hud-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.14s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .hud-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(125, 211, 252, 0.45);
  }

  .hud-btn.active {
    background: rgba(34, 197, 94, 0.24);
    border-color: var(--border-active);
    color: #bbf7d0;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.28);
  }

  select.biome-select {
    background: rgba(8, 14, 24, 0.94);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }

  /* Бегущая новостная строка LIVE TV */
  .news-ticker-bar {
    pointer-events: auto;
    align-self: flex-start;
    max-width: min(680px, 95vw);
    background: rgba(12, 18, 32, 0.88);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(244, 63, 94, 0.42);
    border-radius: 10px;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .news-ticker-bar:hover {
    border-color: rgba(244, 63, 94, 0.85);
  }

  .live-badge {
    background: #e11d48;
    color: #fff;
    font-size: 9.5px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
    letter-spacing: 0.06em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    animation: pulseLive 1.1s infinite;
  }

  @keyframes pulseLive {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .ticker-text {
    font-size: 11.5px;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  /* =========================================================================
     ПАНЕЛЬ НОВОСТНОГО КАНАЛА МИРА (WORLD NEWS FEED)
     ========================================================================= */
  .news-drawer {
    position: fixed;
    top: 84px;
    left: 10px;
    width: 325px;
    max-width: calc(100vw - 20px);
    max-height: 52vh;
    z-index: 28;
    background: var(--glass-hi);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(244, 63, 94, 0.4);
    border-radius: 14px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.65);
  }

  .news-drawer.open {
    display: flex;
  }

  .news-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 6px;
    font-size: 12px;
    font-weight: 800;
  }

  .news-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding-right: 2px;
  }

  .news-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 3px solid #38bdf8;
    border-radius: 8px;
    padding: 6px 8px;
    cursor: pointer;
    transition: background 0.14s ease, transform 0.12s ease;
  }

  .news-card:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateX(2px);
  }

  .news-card.war { border-left-color: #ef4444; }
  .news-card.crime { border-left-color: #f59e0b; }
  .news-card.disaster { border-left-color: #ec4899; }
  .news-card.civ { border-left-color: #10b981; }

  .news-meta {
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .news-msg {
    font-size: 11px;
    line-height: 1.35;
    color: #f8fafc;
  }

  /* =========================================================================
     ИНСПЕКТОР ВЫБРАННОГО ОБЪЕКТА (SIMS / WORLDBOX)
     ========================================================================= */
  .sims-inspector {
    position: fixed;
    top: 84px;
    right: 10px;
    width: 274px;
    z-index: 28;
    background: var(--glass-hi);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(52, 211, 153, 0.4);
    border-radius: 15px;
    padding: 11px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .sims-inspector.open {
    display: flex;
  }

  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 7px;
  }

  .insp-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .insp-avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: rgba(56, 189, 248, 0.16);
    border: 1px solid rgba(56, 189, 248, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .insp-name {
    font-size: 12.5px;
    font-weight: 800;
    color: #fff;
  }

  .insp-role {
    font-size: 10.5px;
    color: #7dd3fc;
  }

  .insp-action {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 11px;
    color: #e2e8f0;
  }

  .need-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .need-top {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #cbd5e1;
  }

  .need-track {
    width: 100%;
    height: 5px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 99px;
    overflow: hidden;
  }

  .need-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.15s ease;
  }

  .insp-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

  /* =========================================================================
     НИЖНИЙ ДОК ИНСТРУМЕНТОВ БОГА (4 ВКЛАДКИ)
     ========================================================================= */
  .bottom-dock {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    max-width: calc(100vw - 14px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none;
  }

  .tool-tooltip {
    pointer-events: none;
    background: rgba(6, 12, 22, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 4px 14px;
    font-size: 11px;
    color: #bae6fd;
    opacity: 0;
    transform: translateY(4px);
    transition: all 0.15s ease;
    white-space: nowrap;
    max-width: 94vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tool-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .cat-tabs {
    pointer-events: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 3px;
  }

  .cat-tab {
    padding: 4px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    transition: all 0.14s ease;
    white-space: nowrap;
  }

  .cat-tab:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }

  .cat-tab.active {
    background: rgba(56, 189, 248, 0.24);
    border-color: rgba(56, 189, 248, 0.65);
    color: #e0f2fe;
  }

  .dock-bar {
    pointer-events: auto;
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    max-width: 100%;
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .dock-group {
    display: none;
    align-items: center;
    gap: 4px;
  }

  .dock-group.active {
    display: flex;
  }

  .dock-sep {
    width: 1px;
    height: 26px;
    background: rgba(148, 210, 255, 0.18);
    margin: 0 2px;
    flex-shrink: 0;
  }

  .tool-btn {
    min-width: 50px;
    height: 44px;
    padding: 3px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: all 0.14s ease;
    flex-shrink: 0;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-2px);
    border-color: rgba(125, 211, 252, 0.45);
  }

  .tool-btn.active {
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.28), rgba(16, 185, 129, 0.14));
    border-color: var(--border-active);
    box-shadow: 0 0 14px rgba(34, 197, 94, 0.3);
    transform: translateY(-2px);
  }

  .tool-ico { font-size: 16px; line-height: 1; }
  .tool-lbl { font-size: 9px; font-weight: 600; color: #cbd5e1; }
  .tool-btn.active .tool-lbl { color: #ecfdf5; }

  .brush-controls {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 3px;
    flex-shrink: 0;
  }

  .size-pills { display: flex; gap: 3px; }
  .sz-btn {
    width: 22px;
    height: 19px;
    border-radius: 5px;
    font-size: 9.5px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--muted);
    cursor: pointer;
  }
  .sz-btn.active { background: rgba(56, 189, 248, 0.28); border-color: #38bdf8; color: #fff; }

  @media (max-width: 820px) {
    .hide-sm { display: none; }
    .sims-inspector { top: auto; bottom: 112px; right: 8px; width: 245px; }
    .news-drawer { top: 76px; width: 280px; }
  }
</style>
</head>
<body>

<canvas id="world-canvas"></canvas>

<!-- ВЕРХНИЙ HUD И НОВОСТНАЯ СТРОКА -->
<div class="top-stack">
  <header class="top-hud">
    <div class="hud-pill">
      <div class="brand-mark">
        <div class="plumbob-icon"></div>
        <span>TERRAFORGE</span>
      </div>
      <select id="biome-select" class="biome-select" title="Выбрать сценарий мира">
        <option value="twin_cities">⚔️ Два соперничающих мегаполиса</option>
        <option value="archipelago">🏝️ Островной архипелаг (4 державы)</option>
        <option value="frontier">🌲 Дикий фронтир (основание с нуля)</option>
        <option value="postapoc">☣️ Постапокалипсис и банды</option>
      </select>
      <button type="button" id="btn-reset" class="hud-btn" title="Пересоздать мир">🎲 Новый мир</button>
    </div>

    <div class="hud-pill">
      <div class="stat-item" title="Города / Люди">🏛️ <strong id="st-civs">0</strong></div>
      <div class="stat-item" title="Машины на дорогах">🚗 <strong id="st-cars">0</strong></div>
      <div class="stat-item" title="Воины / Преступники">⚔️ <strong id="st-war">0 / 0</strong></div>
      <div class="stat-item hide-sm" title="Время суток">🕒 <strong id="st-time">09:30</strong></div>
    </div>

    <div class="hud-pill">
      <div style="display:flex;gap:3px;">
        <button type="button" class="hud-btn view-btn active" data-view="normal">👁️ Мир</button>
        <button type="button" class="hud-btn view-btn" data-view="politics">🚩 Границы</button>
        <button type="button" class="hud-btn view-btn" data-view="blood">🩸 Кровь/HP</button>
      </div>
      <div style="display:flex;gap:3px;">
        <button type="button" class="hud-btn spd-btn" data-spd="0">⏸</button>
        <button type="button" class="hud-btn spd-btn active" data-spd="1">1x</button>
        <button type="button" class="hud-btn spd-btn" data-spd="2">2x</button>
        <button type="button" class="hud-btn spd-btn" data-spd="4">4x</button>
      </div>
      <button type="button" id="btn-audio" class="hud-btn">🔇 Звук</button>
      <button type="button" id="btn-snap" class="hud-btn" title="Снимок в PNG">📸</button>
    </div>
  </header>

  <!-- ЖИВАЯ БЕГУЩАЯ СТРОКА НОВОСТЕЙ -->
  <div class="news-ticker-bar" id="news-ticker-bar" title="Нажмите, чтобы открыть полный новостной канал города и мира">
    <span class="live-badge"><span class="live-dot"></span>LIVE NEWS</span>
    <span class="ticker-text" id="ticker-latest">Запуск прямой трансляции городов и королевств...</span>
    <span style="font-size:10px;color:#94a3b8;">▼ Лента</span>
  </div>
</div>

<!-- ОТКРЫВАЕМАЯ ЛЕНТА НОВОСТЕЙ -->
<aside class="news-drawer" id="news-drawer">
  <div class="news-head">
    <span>📺 НОВОСТНОЙ КАНАЛ МИРА (клик — переход)</span>
    <button type="button" id="news-close" class="hud-btn" style="padding:2px 6px;">✕</button>
  </div>
  <div class="news-list" id="news-list"></div>
</aside>

<!-- ИНСПЕКТОР THE SIMS / WORLDBOX -->
<aside id="sims-inspector" class="sims-inspector">
  <div class="insp-head">
    <div class="insp-title-wrap">
      <div class="insp-avatar" id="insp-avatar">🧑</div>
      <div>
        <div class="insp-name" id="insp-name">Житель</div>
        <div class="insp-role" id="insp-role">Город • Профессия</div>
      </div>
    </div>
    <button type="button" id="insp-close" class="hud-btn" style="padding:3px 7px;">✕</button>
  </div>
  <div class="insp-action" id="insp-action">💭 Занимается делами</div>
  <div id="insp-needs" style="display:flex;flex-direction:column;gap:5px;"></div>
  <div class="insp-btns">
    <button type="button" id="insp-heal" class="hud-btn" style="justify-content:center;border-color:rgba(52,211,153,0.4);">💚 Исцелить</button>
    <button type="button" id="insp-harm" class="hud-btn" style="justify-content:center;border-color:rgba(244,63,94,0.4);">🩸 Урон</button>
    <button type="button" id="insp-follow" class="hud-btn" style="grid-column:1/-1;justify-content:center;">🎯 Следить камерой</button>
  </div>
</aside>

<!-- НИЖНИЙ ДОК ИНСТРУМЕНТОВ -->
<footer class="bottom-dock">
  <div id="tool-tooltip" class="tool-tooltip">Инструмент выбора: кликните по жителю, машине, зданию или столице города</div>

  <div class="cat-tabs">
    <button type="button" class="cat-tab active" data-cat="civ">🏙️ Цивилизация и Города</button>
    <button type="button" class="cat-tab" data-cat="war">⚔️ Война и Криминал</button>
    <button type="button" class="cat-tab" data-cat="terrain">🌋 Ландшафт и Стихии</button>
    <button type="button" class="cat-tab" data-cat="nature">🦌 Природа</button>
  </div>

  <div class="dock-bar">
    <div class="brush-controls">
      <span style="font-size:8.5px;color:var(--muted);text-align:center;font-weight:700;">КИСТЬ</span>
      <div class="size-pills">
        <button type="button" class="sz-btn" data-sz="1">S</button>
        <button type="button" class="sz-btn active" data-sz="3">M</button>
        <button type="button" class="sz-btn" data-sz="6">L</button>
      </div>
    </div>

    <div class="dock-sep"></div>

    <!-- 1. ЦИВИЛИЗАЦИЯ И ГОРОДА -->
    <div class="dock-group active" data-group="civ">
      <button type="button" class="tool-btn active" data-tool="inspect" data-tip="Выбор / Инспектор Sims — кликните по любому человеку, машине, дому или городу">
        <span class="tool-ico">💎</span><span class="tool-lbl">Выбор</span>
      </button>
      <button type="button" class="tool-btn" data-tool="found_city" data-tip="Основать новый город — создает ратушу нового королевства со своей казной и жителями">
        <span class="tool-ico">🏛️</span><span class="tool-lbl">Город</span>
      </button>
      <button type="button" class="tool-btn" data-tool="citizen" data-tip="Поселенец — работает, строит дома, покупает еду, создает семью и платит налоги">
        <span class="tool-ico">🧑</span><span class="tool-lbl">Житель</span>
      </button>

    <!-- 3. ЛАНДШАФТ И СТИХИИ -->
    <div class="dock-group" data-group="terrain">

        <span class="tool-ico">🐟</span><span class="tool-lbl">Рыбы</span>
